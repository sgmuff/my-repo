$schema: https://json-schema.org/draft/2020-12/schema
title: AI system inventory entry
description: "One AI system, model, agent, or AI feature in the AI inventory: what it does, the proposed tier and EU AI Act classification, AIUC-1 mode, the tiering factors, top risks, and the follow-on reviews it needs."
type: object
additionalProperties: false
required: [id, type, schema_version, format_version, kind, title, status, version, source, lifecycle, business_owner,
  system_owner, prepared_by, date_prepared, last_reviewed, next_review, summary, decision, analysis, tier, ai_act,
  autonomy, decisions_about_people, personal_data, aiuc, use, data, tiering, top_risks, follow_ons, containment, related,
  facts, context, issues, actions, open_questions, verify, finding_responses, references, version_history, signoff]
properties:
  id: {type: string, pattern: "^AIS-\\d{4}$"}
  type: {const: ais}
  schema_version: {const: 1}
  format_version: {const: 1}
  kind: {enum: [system]}
  title: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 10}
  status: {$ref: "common.schema.yaml#/$defs/doc_status"}
  version: {$ref: "common.schema.yaml#/$defs/version"}
  source: {enum: [in-house, vendor-model, vendor-product, embedded-feature, TBC], description: "Built in-house, built on a vendor's model, a vendor's product, or an AI feature in a product the company already uses"}
  lifecycle: {enum: [idea, pilot, live, retired]}
  business_owner: {$ref: "common.schema.yaml#/$defs/short"}
  system_owner: {$ref: "common.schema.yaml#/$defs/short"}
  prepared_by: {$ref: "common.schema.yaml#/$defs/short"}
  date_prepared: {$ref: "common.schema.yaml#/$defs/date"}
  last_reviewed: {$ref: "common.schema.yaml#/$defs/date_or_null"}
  next_review: {$ref: "common.schema.yaml#/$defs/date"}
  summary: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 50}
  analysis: {$ref: "common.schema.yaml#/$defs/analysis"}
  decision:
    description: "Whether the use may go ahead pending the follow-ons. The privacy lead confirms the tier and classification."
    $ref: "common.schema.yaml#/$defs/call"
    properties:
      value: {enum: [proceed-to-follow-ons, stop, open]}
  tier:
    description: "0 Stop, 1 High, 2 Elevated, 3 Standard: the highest level any factor reaches"
    $ref: "common.schema.yaml#/$defs/call"
    properties:
      value: {enum: ["0", "1", "2", "3", TBC]}
  ai_act:
    type: object
    additionalProperties: false
    required: [ai_system, company_role, category, annex_point, prohibited]
    properties:
      ai_system: {$ref: "common.schema.yaml#/$defs/call_tristate", description: "Is it an AI system under Art. 3(1)?"}
      company_role:
        $ref: "common.schema.yaml#/$defs/call"
        properties:
          value: {enum: [provider, deployer, provider-and-deployer, not-applicable, TBC]}
      category:
        description: "By documented function, not labels"
        $ref: "common.schema.yaml#/$defs/call"
        properties:
          value: {enum: [prohibited, high-risk, transparency, minimal, not-ai, TBC]}
      annex_point: {$ref: "common.schema.yaml#/$defs/short", description: "Such as Annex III point 4(a), or none"}
      prohibited: {$ref: "common.schema.yaml#/$defs/call_tristate", description: "Could the documented function be an Art. 5 prohibited practice?"}
  autonomy: {enum: [L0-suggest, L1-act-with-approval, L2-act-within-limits, L3-act-broadly, TBC]}
  decisions_about_people: {enum: [none, informs, decides, TBC], description: "Does it inform, or make or materially influence, decisions about people?"}
  personal_data: {enum: [none, personal, sensitive, TBC], description: "sensitive: special category, biometric, student, or children's data"}
  aiuc:
    type: object
    additionalProperties: false
    required: [mode, certification, capabilities]
    properties:
      mode: {enum: [readiness, benchmark, not-applicable], description: "readiness for the company's own agent; benchmark for a vendor's"}
      certification: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 20, description: "For a vendor's agent: product in scope, release, report date, expiry; or none"}
      capabilities:
        type: array
        uniqueItems: true
        items: {enum: [External-facing, Automation, Code-generation, Text-generation, Voice-generation, Image-generation]}
  use:
    description: "What it does"
    type: object
    additionalProperties: false
    required: [inputs, outputs, output_use, users, subjects, tools, model]
    properties:
      inputs: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30}
      outputs: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "With a sample where you have one"}
      output_use: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "What happens to the output"}
      users: {$ref: "common.schema.yaml#/$defs/short"}
      subjects: {$ref: "common.schema.yaml#/$defs/short", description: "The people the outputs are about"}
      tools: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "For agents: tools and permissions; otherwise none"}
      model: {$ref: "common.schema.yaml#/$defs/short", description: "The underlying model and provider"}
  data:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [data, sensitivity, source, retention]
      properties:
        data: {$ref: "common.schema.yaml#/$defs/short"}
        sensitivity: {enum: [none, personal, sensitive, TBC]}
        source: {$ref: "common.schema.yaml#/$defs/short"}
        retention: {$ref: "common.schema.yaml#/$defs/short", description: "Retained by whom, and how long"}
  tiering:
    description: "Each factor's level and the fact behind it"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [factor, level, fact]
      properties:
        factor: {enum: [ai-act-use, decisions-about-people, people-affected, data, autonomy, reach-and-reversibility, source]}
        level: {enum: ["0", "1", "2", "3", TBC]}
        fact: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 25}
  top_risks:
    description: "Three to six risks from risk-method.md section 2a, one line each, with who is affected"
    type: array
    items: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 25}
  follow_ons:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [follow_on, why, status, record]
      properties:
        follow_on: {enum: [ai-impact-assessment, dpia-screening, vendor-review, aup, ai-act-provider, ai-act-deployer, aiuc-readiness]}
        why: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 20}
        status: {enum: [recommended, in-progress, done, not-needed]}
        record: {type: string, description: "The follow-on's record ID once it exists (AIIA, SCR, DPIA, VR, AIP, AID, RDY), or none"}
  containment:
    description: "A control applied before review, if any"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [control, owner, applied, evidence, downstream_stopped, remaining_paths, reenable_when]
      properties:
        control: {$ref: "common.schema.yaml#/$defs/short"}
        owner: {$ref: "common.schema.yaml#/$defs/short", description: "Owner and approver"}
        applied: {$ref: "common.schema.yaml#/$defs/short", description: "When requested and applied, with the time"}
        downstream_stopped: {$ref: "common.schema.yaml#/$defs/tristate", description: "Is the output no longer generated, shown, exported, or used downstream?"}
        evidence: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 20}
        remaining_paths: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 20}
        reenable_when: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 20}
  related:
    type: object
    additionalProperties: false
    required: [ropa, vendor_review]
    properties:
      ropa: {type: string, description: "ROPA-NNNN, or none"}
      vendor_review: {type: string, description: "VR-YYYY-NNN, or none"}
  facts: {$ref: "common.schema.yaml#/$defs/facts"}
  context: {$ref: "common.schema.yaml#/$defs/context"}
  issues: {$ref: "common.schema.yaml#/$defs/issues"}
  actions: {$ref: "common.schema.yaml#/$defs/actions"}
  open_questions: {$ref: "common.schema.yaml#/$defs/open_questions"}
  verify: {$ref: "common.schema.yaml#/$defs/verify"}
  finding_responses: {$ref: "common.schema.yaml#/$defs/finding_responses"}
  references: {$ref: "common.schema.yaml#/$defs/references"}
  version_history: {$ref: "common.schema.yaml#/$defs/version_history"}
  signoff: {$ref: "common.schema.yaml#/$defs/signoff"}
