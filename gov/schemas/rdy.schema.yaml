$schema: https://json-schema.org/draft/2020-12/schema
title: AIUC-1 readiness report
description: "Readiness of one agent or AI system for AIUC-1 certification: scope and capability tags, the Statement of Applicability with each requirement's controls, evidence, and gaps, the recurring testing schedule, and the milestones to the audit."
type: object
additionalProperties: false
required: [id, type, schema_version, format_version, kind, title, status, version, system, release, target_release, capabilities,
  out_of_scope, business_owner, system_owner, prepared_by, date_prepared, last_reviewed, next_review, summary, decision,
  analysis, soa, testing, milestones, facts, context, issues, actions, open_questions, verify, finding_responses,
  references, version_history, signoff]
properties:
  id: {type: string, pattern: "^RDY-\\d{4}-\\d{3}$"}
  type: {const: rdy}
  schema_version: {const: 1}
  format_version: {const: 1}
  kind: {enum: [readiness]}
  title: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 10}
  status: {$ref: "common.schema.yaml#/$defs/doc_status"}
  version: {$ref: "common.schema.yaml#/$defs/version"}
  system: {type: string, description: "The AI inventory entry, AIS-NNNN, or TBC"}
  release: {$ref: "common.schema.yaml#/$defs/short", description: "The AIUC-1 release this report is assessed against, such as October 15, 2026"}
  target_release: {$ref: "common.schema.yaml#/$defs/short", description: "The release the audit will run against, fixed at kickoff; TBC until then"}
  capabilities:
    description: "The agent's AIUC-1 capability tags; Universal always applies"
    type: array
    uniqueItems: true
    items: {enum: [External-facing, Automation, Code-generation, Text-generation, Voice-generation, Image-generation]}
  out_of_scope: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "What is out of scope, and why"}
  business_owner: {$ref: "common.schema.yaml#/$defs/short"}
  system_owner: {$ref: "common.schema.yaml#/$defs/short"}
  prepared_by: {$ref: "common.schema.yaml#/$defs/short"}
  date_prepared: {$ref: "common.schema.yaml#/$defs/date"}
  last_reviewed: {$ref: "common.schema.yaml#/$defs/date_or_null"}
  next_review: {$ref: "common.schema.yaml#/$defs/date"}
  summary: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 50}
  analysis: {$ref: "common.schema.yaml#/$defs/analysis"}
  decision:
    description: "Readiness for the audit. The privacy lead and the system owner decide when to start it."
    $ref: "common.schema.yaml#/$defs/call"
    properties:
      value: {enum: [ready, gaps, not-ready, open]}
  soa:
    description: "The Statement of Applicability: one row per requirement in scope, excluded, or opted into"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [requirement, applicability, rationale, responsible, controls, evidence, gap]
      properties:
        requirement: {type: string, pattern: "^[A-F]\\d{3}$"}
        applicability: {enum: [in-scope, excluded, opted-in, undecided], description: "undecided: an optional requirement whose opt-in the business hasn't decided"}
        rationale: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "Why it applies, or the one- or two-sentence exclusion justification"}
        responsible: {enum: [company, model-provider, shared, TBC]}
        controls: {type: array, items: {type: string, pattern: "^CTL-\\d{4}$"}}
        evidence: {type: array, items: {type: string, pattern: "^EV-\\d{4}$"}}
        gap: {enum: [none, partial, missing, TBC]}
  testing:
    description: "Recurring duties: the third-party testing requirements, internal reviews, and re-certification"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [duty, requirement, frequency, last_done, next_due, control]
      properties:
        duty: {$ref: "common.schema.yaml#/$defs/short"}
        requirement: {type: string, description: "The AIUC-1 ID, or none for re-certification"}
        frequency: {$ref: "common.schema.yaml#/$defs/short"}
        last_done: {anyOf: [{$ref: "common.schema.yaml#/$defs/date"}, {enum: [TBC, never]}]}
        next_due: {$ref: "common.schema.yaml#/$defs/date_or_tbc"}
        control: {type: string, description: "The CTL control that carries it, or TBC"}
  milestones:
    description: "Gates to the audit, not commitments"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [gate, target, entry_condition, status]
      properties:
        gate: {$ref: "common.schema.yaml#/$defs/short"}
        target: {$ref: "common.schema.yaml#/$defs/date_or_tbc"}
        entry_condition: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 25}
        status: {enum: [not-started, in-progress, met, TBC]}
  facts: {$ref: "common.schema.yaml#/$defs/facts"}
  context: {$ref: "common.schema.yaml#/$defs/context"}
  issues: {$ref: "common.schema.yaml#/$defs/issues"}
  actions: {$ref: "common.schema.yaml#/$defs/actions"}
  open_questions: {$ref: "common.schema.yaml#/$defs/open_questions"}
  verify: {$ref: "common.schema.yaml#/$defs/verify"}
  finding_responses: {$ref: "common.schema.yaml#/$defs/finding_responses"}
  references: {$ref: "common.schema.yaml#/$defs/references"}
  version_history: {$ref: "common.schema.yaml#/$defs/version_history"}
  signoff: {$ref: "common.schema.yaml#/$defs/signoff"}
