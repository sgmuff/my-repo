$schema: https://json-schema.org/draft/2020-12/schema
title: Data protection impact assessment
description: "A GDPR Art. 35 DPIA for one processing activity: description, necessity and proportionality, risks to individuals with inherent, current, and target ratings, consultation, and other regimes. gov computes each rating from the risk matrix."
type: object
additionalProperties: false
required: [id, type, schema_version, format_version, kind, title, status, version, activity, screening, business_owner,
  system_owner, prepared_by, date_prepared, last_reviewed, next_review, summary, decision, analysis, processing,
  necessity, risks, consultation, other_regimes, facts, context, issues, actions, open_questions, verify, finding_responses,
  references, version_history, signoff]
properties:
  id: {type: string, pattern: "^DPIA-\\d{4}-\\d{3}$"}
  type: {const: dpia}
  schema_version: {const: 1}
  format_version: {const: 1}
  kind: {enum: [controller, us-assessment], description: "controller: a GDPR Art. 35 DPIA. us-assessment: the GDPR doesn't apply, and the record is a US state data protection or CPPA risk assessment, with FERPA, COPPA, and state student privacy laws where they apply"}
  title: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 10}
  status: {$ref: "common.schema.yaml#/$defs/doc_status"}
  version: {$ref: "common.schema.yaml#/$defs/version"}
  activity: {type: string, description: "The RoPA entry, ROPA-NNNN, or TBC"}
  screening: {type: string, description: "The screening record, SCR-YYYY-NNN, or TBC"}
  business_owner: {$ref: "common.schema.yaml#/$defs/short"}
  system_owner: {$ref: "common.schema.yaml#/$defs/short"}
  prepared_by: {$ref: "common.schema.yaml#/$defs/short"}
  date_prepared: {$ref: "common.schema.yaml#/$defs/date"}
  last_reviewed: {$ref: "common.schema.yaml#/$defs/date_or_null"}
  next_review: {$ref: "common.schema.yaml#/$defs/date"}
  summary: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 50}
  analysis: {$ref: "common.schema.yaml#/$defs/analysis"}
  decision:
    description: "The proposed outcome. Only the approver set by the current residual rating confirms it."
    $ref: "common.schema.yaml#/$defs/call"
    properties:
      value: {enum: [proceed, proceed-with-conditions, prior-consultation, do-not-proceed, open]}
  processing:
    description: "Art. 35(7)(a): the processing in brief. The RoPA entry holds the full inventory."
    type: object
    additionalProperties: false
    required: [nature, scope, context, purposes, special_category, children]
    properties:
      nature: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 40, description: "What is done with the data, by which systems"}
      scope: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 40, description: "Whose data, how many people, how much, how long, where"}
      context: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 40, description: "The relationship, expectations, and any vulnerability"}
      purposes: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 40}
      special_category: {$ref: "common.schema.yaml#/$defs/call_tristate", description: "Art. 9 or Art. 10 data, including by inference"}
      children: {$ref: "common.schema.yaml#/$defs/call_tristate"}
  necessity:
    description: "Art. 35(7)(b): one row per principle"
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [principle, position, basis, gap, link]
      properties:
        principle: {enum: [lawful-basis, art9-condition, minimization, purpose-limitation, transparency, rights, retention, automated-decisions, transfers]}
        position: {enum: [adequate, gap, not-met, not-applicable, TBC]}
        basis: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "The position and its citation"}
        gap: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 25, description: "What's missing, or none"}
        link: {type: string, description: "A linked record such as LIA-2026-001, TIA-2026-002, or TSR-2026-001, or none"}
  risks: {$ref: "common.schema.yaml#/$defs/risks", description: "Art. 35(7)(c)-(d): risks to individuals, each with inherent, current (verified measures only), and target (planned measures) levels"}
  consultation:
    description: "Art. 35(2), 35(9), and Art. 36"
    type: object
    additionalProperties: false
    required: [dpo, data_subjects, prior_consultation]
    properties:
      dpo: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "The DPO's advice and whether it was followed, or not-applicable"}
      data_subjects: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 30, description: "Views sought from data subjects or their representatives, or why not"}
      prior_consultation: {$ref: "common.schema.yaml#/$defs/call_tristate", description: "Is Art. 36 prior consultation required, on the current rating?"}
  other_regimes:
    description: "Catalog regimes this activity triggers, with only their extra elements"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [regime, applies, elements]
      properties:
        regime: {enum: [uk-gdpr, ch-fadp, us-states, cppa, ferpa, coppa, state-student-privacy, eu-ai-act]}
        applies: {$ref: "common.schema.yaml#/$defs/call_tristate"}
        elements: {$ref: "common.schema.yaml#/$defs/text", x-max-words: 40}
  facts: {$ref: "common.schema.yaml#/$defs/facts"}
  context: {$ref: "common.schema.yaml#/$defs/context"}
  issues: {$ref: "common.schema.yaml#/$defs/issues"}
  actions: {$ref: "common.schema.yaml#/$defs/actions"}
  open_questions: {$ref: "common.schema.yaml#/$defs/open_questions"}
  verify: {$ref: "common.schema.yaml#/$defs/verify"}
  finding_responses: {$ref: "common.schema.yaml#/$defs/finding_responses"}
  references: {$ref: "common.schema.yaml#/$defs/references"}
  version_history: {$ref: "common.schema.yaml#/$defs/version_history"}
  signoff: {$ref: "common.schema.yaml#/$defs/signoff"}
