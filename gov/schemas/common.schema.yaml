$schema: https://json-schema.org/draft/2020-12/schema
$id: common.schema.yaml
title: Shared definitions for gov record schemas
description: Referenced as common.schema.yaml#/$defs/<name>.
$defs:
  context:
    description: "Facts that raise issues, from gov/rules/issues.yaml context_tags"
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^[a-z][a-z-]*$"}
  issues:
    description: "How the record addresses each issue gov/rules/issues.yaml raises for it"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [issue, status, note]
      properties:
        issue: {type: string, pattern: "^[a-z][a-z-]*$"}
        status: {enum: [addressed, not-applicable, open]}
        note: {$ref: "#/$defs/text", x-max-words: 40, description: "Where it's addressed and the conclusion, why it doesn't apply, or what's needed"}
  reasoning: {$ref: "#/$defs/text", x-max-words: 100, description: "The analysis behind the call, with citations"}
  analysis: {$ref: "#/$defs/text", x-max-words: 400, description: "The full legal analysis, with citations: every regime and country involved, the provisional view and why, and what would change it"}
  text: {type: string, minLength: 1}
  short: {type: string, minLength: 1, x-max-words: 12}
  date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
  date_or_null: {anyOf: [{$ref: "#/$defs/date"}, {type: "null"}]}
  date_or_tbc: {anyOf: [{$ref: "#/$defs/date"}, {const: TBC}]}
  tristate:
    description: "true, false, or TBC"
    anyOf: [{type: boolean}, {const: TBC}]
  doc_status: {enum: [Draft, In review, Approved, Approved with conditions, Rejected, Superseded]}
  position_status: {enum: [Provisional, Confirmed]}
  version: {type: string, pattern: "^\\d+\\.\\d+$", description: "Quoted, such as \"0.1\""}
  call:
    description: "A legal or factual position: its value, Provisional or Confirmed (only an approver confirms), and a one-line reason."
    type: object
    additionalProperties: false
    required: [value, status, reason]
    properties:
      value: true
      status: {$ref: "#/$defs/position_status"}
      reason: {$ref: "#/$defs/text", x-max-words: 20}
  call_tristate:
    $ref: "#/$defs/call"
    properties:
      value: {$ref: "#/$defs/tristate"}
  source:
    description: "Where the value came from: document (name and version), stated (name, role, date), inferred (from what), or tbc"
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind: {enum: [document, stated, inferred, tbc]}
      ref: {type: string, minLength: 1, x-max-words: 15}
    if: {properties: {kind: {enum: [document, stated, inferred]}}}
    then: {required: [ref]}
  actions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, action, owner, due, closure_evidence, launch_blocking, status]
      properties:
        id: {type: string, pattern: "^A\\d+$"}
        action: {$ref: "#/$defs/text", x-max-words: 20}
        owner: {$ref: "#/$defs/short"}
        due: {$ref: "#/$defs/date_or_tbc"}
        closure_evidence: {$ref: "#/$defs/text", x-max-words: 15}
        launch_blocking: {type: boolean}
        block_reason: {enum: [law, policy, risk]}
        scope: {$ref: "#/$defs/short", description: "For a law block, the provision that requires the action, such as GDPR Art. 14"}
        status: {enum: [open, done]}
      if: {properties: {launch_blocking: {const: true}}}
      then: {required: [block_reason]}
  risk_level:
    type: object
    additionalProperties: false
    required: [likelihood, severity]
    properties:
      likelihood: {enum: [remote, possible, probable, TBC]}
      severity: {enum: [minimal, significant, severe, TBC]}
  risks:
    description: "Risks to individuals, each with inherent, current (verified measures only), and target (planned measures) levels; gov computes the ratings"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, risk, inherent, current, target, measures, owner]
      properties:
        id: {type: string, pattern: "^R\\d+$"}
        risk: {$ref: "#/$defs/text", x-max-words: 40, description: "Who is harmed and how"}
        inherent: {$ref: "#/$defs/risk_level"}
        current: {$ref: "#/$defs/risk_level"}
        target: {$ref: "#/$defs/risk_level"}
        measures:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [measure, status, evidence]
            properties:
              measure: {$ref: "#/$defs/text", x-max-words: 25}
              status: {enum: [verified, unverified, planned, absent]}
              evidence: {$ref: "#/$defs/text", x-max-words: 25, description: "What shows it, or the evidence that would verify it, or the action ID"}
        owner: {$ref: "#/$defs/short"}
  facts:
    description: "The fact register: each fact the assessment relies on, with its status and source"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, fact, status, source]
      properties:
        id: {type: string, pattern: "^F\\d+$"}
        fact: {$ref: "#/$defs/text", x-max-words: 25}
        status: {enum: [confirmed, stated-by-requester, stated-by-vendor, assumption, TBC]}
        source: {$ref: "#/$defs/source"}
  open_questions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, question, field, blocks, owner, needed_by]
      properties:
        id: {type: string, pattern: "^Q\\d+$"}
        question: {$ref: "#/$defs/text", x-max-words: 30}
        field: {$ref: "#/$defs/short"}
        blocks: {enum: [launch, approval, record, notice, none]}
        owner: {$ref: "#/$defs/short"}
        needed_by: {$ref: "#/$defs/date_or_tbc"}
  verify:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, claim, why, check, owner, needed_by]
      properties:
        id: {type: string, pattern: "^V\\d+$"}
        claim: {$ref: "#/$defs/text", x-max-words: 25}
        why: {$ref: "#/$defs/text", x-max-words: 20}
        check: {$ref: "#/$defs/text", x-max-words: 15}
        owner: {$ref: "#/$defs/short"}
        needed_by: {$ref: "#/$defs/date_or_tbc"}
  finding_responses:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [pointer, response, by]
      properties:
        pointer: {$ref: "#/$defs/short"}
        response: {$ref: "#/$defs/text", x-max-words: 25}
        by: {$ref: "#/$defs/short"}
  references:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [file, version, verified]
      properties:
        file: {type: string, pattern: "^[a-z0-9-]+\\.md$"}
        version: {$ref: "#/$defs/short"}
        verified: {$ref: "#/$defs/date"}
  version_history:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [version, date, author, change]
      properties:
        version: {$ref: "#/$defs/version"}
        date: {$ref: "#/$defs/date"}
        author: {$ref: "#/$defs/short"}
        change: {$ref: "#/$defs/text", x-max-words: 15}
  signoff:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [decision, approver_role, name, date, outcome]
      properties:
        decision: {$ref: "#/$defs/text", x-max-words: 10}
        approver_role: {$ref: "#/$defs/short"}
        name: {anyOf: [{$ref: "#/$defs/short"}, {type: "null"}]}
        date: {$ref: "#/$defs/date_or_null"}
        outcome: {enum: [approved, approved-with-conditions, rejected, null]}
