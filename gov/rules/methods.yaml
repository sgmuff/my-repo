# The method each assessment kind follows, printed under the decision. Edit here, not in templates.
lia:
  lia: "GDPR and UK GDPR Art. 6(1)(f): purpose, necessity, and balancing tests (CJEU C-621/22; EDPB Guidelines 1/2024; ICO legitimate interests guidance)"
  recognized-interest: "UK GDPR Art. 6(1)(ea) and Annex 1, as inserted by the Data (Use and Access) Act 2025; ICO guidance"
  compatibility: "GDPR and UK GDPR Art. 6(4)(a)-(e) compatibility factors; Art. 5(1)(b)"
tia:
  eu-tia: "EDPB Recommendations 01/2020 (six steps) and 2021 SCCs Clause 14; CJEU C-311/18 (Schrems II)"
  uk-tra: "UK data protection test since the Data (Use and Access) Act 2025: protection not materially lower, judged reasonably and proportionately; ICO transfer risk assessment guidance (January 2026)"
  ch-tia: "Swiss FADP Art. 16(2); FDPIC guidance on transfers abroad"
tsr:
  # A screen's method follows its first regime.
  adequacy:
    eu-gdpr: "GDPR Art. 45 adequacy, including the EU-US Data Privacy Framework (Implementing Decision (EU) 2023/1795); a TIA applies only to Art. 46 tools"
    uk-gdpr: "UK GDPR adequacy regulations, including the UK Extension to the EU-US DPF; a transfer risk assessment applies only to Art. 46 safeguards"
    ch-fadp: "Swiss FADP Art. 16(1) and Annex 1 of the Data Protection Ordinance, including the Swiss-U.S. DPF; a transfer assessment applies only to Art. 16(2) safeguards"
ais:
  system: "tiering.md: the tier is the highest level any factor reaches; EU AI Act classification by documented function (eu-ai-act.md); AIUC-1 mode and capability tags (aiuc-1.md)"
rdy:
  readiness: "AIUC-1 for the release named in the record, from aiuc-1.md: the mandatory requirements the agent's capability tags trigger, and the certification and testing duties"
inc:
  incident: "GDPR Arts. 33-34 and 4(12); UK GDPR; FADP Art. 24; the US state breach laws in us-breach-notification.md; contracts. Clocks from gov clock; public holidays not applied"
aiia:
  aiia: "assessment-guide.md, sections 2-10, aligned to AIUC-1, NIST AI RMF, ISO/IEC 42001, and the EU AI Act; risk ratings from risk-method.md, with reach, reversibility, and autonomy in severity"
  fria: "EU AI Act Art. 27(1)-(4), as amended by Regulation (EU) 2026/1744: the deployer's fundamental rights impact assessment before first use"
  fria-input-pack: "EU AI Act Arts. 13 and 27: the provider's information for each deployer's own FRIA; whether a deployer owes one is the deployer's determination"
vr:
  new: "GDPR Art. 28 and Chapter V, US state processor and service provider terms, and dpa-checklist.md; risk ratings from risk-method.md, with current counting verified measures only"
  renewal: "GDPR Art. 28 and Chapter V, US state processor and service provider terms, and dpa-checklist.md, carrying forward what still holds from the last review"
  reassessment: "GDPR Art. 28 and Chapter V and dpa-checklist.md, for what changed since the last review"
  notice: "GDPR Art. 28(2) and 28(4), and dpa-checklist.md item 3.1, for the subprocessor or terms change in the notice"
dpia:
  us-assessment: "US state data protection assessments and the CPPA risk assessment (11 CCR § 7150), with FERPA, COPPA, and state student privacy laws where they apply; GDPR Art. 35 doesn't apply. Risk ratings from risk-method.md, with current counting verified measures only"
  controller: "GDPR Art. 35(7) and 36; risk ratings from risk-method.md, with current counting verified measures only (Regulation (EU) 2016/679)"
scr:
  screening: "GDPR Art. 35(1), 35(3), 35(4); WP29 Guidelines on DPIA (WP248 rev.01), endorsed by the EDPB: the criteria are indicators of likely high risk, not triggers"
aip:
  outside-scope: "AI Act Arts. 6(1)-(2), Annexes I and III: an AI system outside both annexes, so only the general duties apply, such as Art. 4 AI literacy, the Art. 5 prohibitions, and Art. 50 transparency (Regulation (EU) 2024/1689 as amended by 2026/1744)"
  non-high-risk: "AI Act Art. 6(3)-(4) and Art. 49(2): an Annex III system documented as not high-risk, registered before it is placed on the market (Regulation (EU) 2024/1689 as amended by 2026/1744)"
  high-risk: "AI Act Arts. 6, 9-17, 43, 47-49, 72-73: provider obligations for a high-risk system (Regulation (EU) 2024/1689 as amended by 2026/1744)"
aid:
  deployer: "AI Act Arts. 4, 25-27, 50, 86: deployer duties for a high-risk system (Regulation (EU) 2024/1689 as amended by 2026/1744)"
