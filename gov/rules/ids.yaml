# Document ID prefixes (conventions.md section 9).
# yearly: IDs carry the year, as in DPIA-2026-004, and number from 1 each year.
# digits: zero padding of the sequence number.
# type and folder: set only for record types that gov manages as YAML.
version: 1
prefixes:
  ROPA: {digits: 4, yearly: false, type: ropa, folder: registers/ropa}
  DPIA: {digits: 3, yearly: true, type: dpia, folder: assessments/dpia}
  SCR: {digits: 3, yearly: true, type: scr, folder: assessments/dpia/screening}
  VR: {digits: 3, yearly: true, type: vr, folder: vendors}
  AIS: {digits: 4, yearly: false, type: ais, folder: registers/ai-inventory}
  AIIA: {digits: 3, yearly: true, type: aiia, folder: assessments/ai-impact}
  DSR: {digits: 3, yearly: true, type: dsr, folder: dsr}
  INC: {digits: 3, yearly: true, type: inc, folder: incidents}
  CTL: {digits: 4, yearly: false, type: ctl, folder: registers/controls}
  EV: {digits: 4, yearly: false}
  RDY: {digits: 3, yearly: true, type: rdy, folder: assessments/aiuc-readiness}
  PA: {digits: 3, yearly: true}
  NR: {digits: 3, yearly: true}
  POL: {digits: 4, yearly: false}
  RC: {digits: 3, yearly: true}
  LIA: {digits: 3, yearly: true, type: lia, folder: assessments/lia}
  TIA: {digits: 3, yearly: true, type: tia, folder: assessments/tia}
  TSR: {digits: 3, yearly: true, type: tsr, folder: assessments/transfer-screens}
  AIP: {digits: 3, yearly: true, type: aip, folder: assessments/ai-act/provider}
  AID: {digits: 3, yearly: true, type: aid, folder: assessments/ai-act/deployer}
