- about: step 1
  decision: Whether a full DPIA or state assessment is required; risk acceptance by rating
  owner: Privacy lead
  gate: policy
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: step 2
  decision: Onboard, onboard with conditions, or not
  owner: Approver for the residual rating
  gate: law
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: step 3
  decision: Which flows are restricted, the mechanism for each, and supplementary measures
  owner: Privacy lead
  gate: law
  status: conditional
  applies_if: cross_border_access = yes
  blocks_launch: true
  note: 'No skill yet: the owner runs this step by hand, and launch waits until the result is recorded'
- about: step 4
  decision: Business owner confirms the facts; privacy lead approves the entry
  owner: Business owner, then privacy lead
  gate: law
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: step 5
  decision: Any notice change, and its timing
  owner: Privacy lead and counsel
  gate: law
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: lawful-basis
  decision: A lawful basis for each purpose we decide, documented before processing starts (GDPR Art. 6). The DPIA informs it but doesn't choose it.
  owner: Privacy lead
  gate: law
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: indirect-notice
  decision: 'Notice to people whose data we didn''t collect from them: content, timing, and any exception (GDPR Art. 14)'
  owner: Privacy lead and counsel
  gate: law
  status: conditional
  applies_if: indirect_collection = yes
  blocks_launch: true
  note: null
- about: direct-marketing
  decision: Handling the absolute right to object to direct marketing (GDPR Art. 21(2)-(3)), and e-marketing consent rules (ePrivacy, PECR, CAN-SPAM)
  owner: Counsel
  gate: law
  status: conditional
  applies_if: direct_marketing = yes
  blocks_launch: true
  note: null
- about: tracking-consent
  decision: Consent for cookies and device storage (ePrivacy Directive Art. 5(3); PECR reg. 6) and state tracking rules
  owner: Counsel
  gate: law
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: recording-consent
  decision: Recording consent under state wiretap laws, including all-party consent states
  owner: Counsel
  gate: law
  status: conditional
  applies_if: audio_video_recording = yes
  blocks_launch: true
  note: null
- about: biometrics
  decision: Biometric identifiers under GDPR Art. 9 and state biometric laws, such as Illinois BIPA
  owner: Counsel
  gate: law
  status: conditional
  applies_if: biometrics = yes
  blocks_launch: true
  note: null
- about: coppa
  decision: 'COPPA: verifiable parental consent, or school authorization limited to the school''s purposes'
  owner: Counsel
  gate: law
  status: conditional
  applies_if: children_or_students = yes and children_under_13 = yes
  blocks_launch: true
  note: null
- about: student-privacy
  decision: FERPA school-official conditions and state student privacy laws, such as SOPIPA and NY Educ. Law § 2-d
  owner: Privacy lead and counsel
  gate: law
  status: conditional
  applies_if: children_or_students = yes and school_context = yes
  blocks_launch: true
  note: null
- about: vendor-own-use
  decision: 'Vendor use for its own purposes: forbid it in the contract, or treat the vendor as a controller for that use (GDPR Art. 28(3)(a), 28(10))'
  owner: Privacy lead
  gate: law
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: scraped-source
  decision: 'Whether the source is lawful to use: platform terms, anti-scraping and computer-misuse law, and the source''s own basis'
  owner: Counsel
  gate: risk
  status: conditional
  applies_if: indirect_collection = yes and scraped_data = yes
  blocks_launch: true
  note: null
- about: session-replay
  decision: 'Session replay: consent before recording, and masking of form fields and other sensitive input'
  owner: Counsel
  gate: risk
  status: required
  applies_if: null
  blocks_launch: true
  note: null
- about: us-sale-sharing
  decision: Whether disclosures to the vendor are a sale or sharing under state privacy laws, and the opt-out and Global Privacy Control duties that follow
  owner: Privacy lead and counsel
  gate: law
  status: required
  applies_if: null
  blocks_launch: true
  note: null
