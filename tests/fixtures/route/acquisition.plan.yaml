question_candidates:
- fact: ai_involved
  question: Does it use AI, including an AI feature in a purchased tool?
- fact: vendor_involved
  question: Is a vendor, subprocessor, or AI provider involved?
- fact: tracking_tech
  question: Does it use cookies, SDKs, pixels, or device identifiers?
- fact: company_role
  question: Do we decide why and how the data is used, or do we act on a customer's instructions?
- fact: school_context
  question: Do schools, districts, or universities provide the data or use the service?
- fact: children_under_13
  question: Are any of the children under 13?
- fact: indirect_collection
  question: Do we get the data from somewhere other than the people themselves, such as LinkedIn, a list, or a customer?
- fact: cross_border_access
  question: Will anyone outside the EEA, UK, or Switzerland store or access the data, including vendor support and subprocessors?
