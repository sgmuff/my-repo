name: ci

on:
  push:
  pull_request:

jobs:
  gov:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Records are valid
        run: gov validate
      - name: Rendered files match their records
        run: gov render --check
