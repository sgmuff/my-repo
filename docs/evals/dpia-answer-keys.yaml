# Answer keys for the DPIA holdout (dpia-scenarios.yaml), in the format of ai-act-answer-keys.yaml.
# Status: DRAFT by Claude 2026-10-21, written from the law before any holdout run, for counsel to edit. Not binding
#   until counsel approves; every point is a proposal.
# key_version: 0 (draft). legal_text_date: none yet; points marked check: true weren't verified against primary text.
# Scoring, error rules, and the no-double-penalty rule: as in the header of ai-act-answer-keys.yaml (key_version 6).
# Score the screening call and the assessment's substance, not the record format, which tests already pin.

dpia-01-gym-wearables-insurer:
  outcome: "A DPIA is warranted: health data (heart rate, activity) evaluated into a score and shared with an insurer for pricing hits several criteria and Art. 35(3)(b) is arguable at scale. The crux is the Art. 9 condition: explicit consent under Art. 9(2)(a) is doubtful where a discount depends on it, so the design must make consent genuinely free (no detriment for refusing, equivalent alternatives) and share the minimum. Current residual risk is likely High until that's designed and verified."
  points:
    - id: K1
      weight: must
      point: "Screens as warranted, naming the criteria: special category health data (4), evaluation or scoring (1), and arguably combining datasets (6) and large scale (5), with the facts behind each."
      source: "GDPR Art. 4(15), 9(1), 35(1); WP248 rev.01"
    - id: K2
      weight: must
      point: "Identifies the Art. 9 condition as the crux and tests whether explicit consent is freely given when a premium discount depends on it, rather than assuming it."
      source: "GDPR Art. 7(4), 9(2)(a); Recital 43; EDPB Guidelines 05/2020 on consent, paras 13-14, 46-49"
      check: true
    - id: K3
      weight: must
      point: "Treats the gym and the insurer as separate controllers for their own purposes, so the sharing is a disclosure needing its own basis and Art. 9 condition, and the insurer's use is the insurer's to assess."
      source: "GDPR Art. 4(7), 26; Art. 6(1), 9(2)"
    - id: K4
      weight: must
      point: "Minimization: shares a coarse score rather than raw heart-rate or step data, and states what the insurer receives and keeps."
      source: "GDPR Art. 5(1)(c), 25"
    - id: K5
      weight: should
      point: "Checks the Irish and Dutch Art. 35(4) lists, both of which cover large-scale health or monitoring data, rather than relying on the EDPB criteria alone."
      source: "GDPR Art. 35(4); DPC and Autoriteit Persoonsgegevens DPIA lists"
      check: true
    - id: K6
      weight: should
      point: "Rates current residual risk High while consent design and minimization are unverified, and treats prior consultation as open until verified measures bring it down."
      source: "GDPR Art. 36(1); risk-method.md"

dpia-02-newsletter-ab-test:
  outcome: "No DPIA is indicated. Testing two subject lines on an existing newsletter to existing customers meets no EDPB criterion in substance: no evaluation of individuals beyond aggregate open rates, no sensitive data, no vulnerable group, modest scale for the processing's nature. Record the screening and the reasoning. The real points are e-marketing rules for the newsletter itself and any open-tracking pixel."
  points:
    - id: K1
      weight: must
      point: "Concludes a DPIA isn't indicated, with reasons tied to the criteria, and records the screening rather than writing a full DPIA."
      source: "GDPR Art. 35(1); WP248 rev.01"
    - id: K2
      weight: must
      point: "Doesn't treat 'new' or 'uses a vendor tool' as a trigger; a policy of screening all new processing is satisfied by the screening record."
      source: "GDPR Art. 35(1); WP248 rev.01"
    - id: K3
      weight: should
      point: "Notes that open and click tracking by pixel needs ePrivacy consent in France and Germany unless strictly necessary, separate from the DPIA question."
      source: "ePrivacy Directive Art. 5(3); TTDSG (now TDDDG) § 25; CNIL guidance on email tracking pixels"
      check: true
    - id: K4
      weight: should
      point: "Confirms the newsletter itself rests on consent or the existing-customer exception (soft opt-in) for similar products, with an opt-out in each message."
      source: "ePrivacy Directive Art. 13(1)-(2); Code des postes et des communications électroniques L34-5; UWG § 7(3)"
      check: true

dpia-03-delivery-driver-telematics:
  outcome: "A DPIA is warranted, and on current facts prior consultation is likely: continuous driver-facing cameras with AI that flags behavior and scores employees weekly is systematic monitoring of a vulnerable group with innovative technology and evaluation. National employment law is decisive in both countries. The AI Act likely makes the scoring high-risk under Annex III point 4(b) from 2 December 2027, with the March 2027 rollout before that date."
  points:
    - id: K1
      weight: must
      point: "Screens as warranted on systematic monitoring (3), vulnerable employees (7), innovative technology (8), and evaluation or scoring (1), and checks the Spanish and Italian Art. 35(4) lists."
      source: "GDPR Art. 35(1), 35(4); WP248 rev.01; AEPD and Garante DPIA lists"
      check: true
    - id: K2
      weight: must
      point: "Applies national workplace monitoring law: in Spain, LOPDGDD Art. 89 (prior, clear information to workers and representatives on video monitoring); in Italy, Workers' Statute Art. 4, which requires a union agreement or labour inspectorate authorization before installing equipment that allows remote monitoring."
      source: "LOPDGDD Arts. 87-89; Statuto dei lavoratori (Law 300/1970) Art. 4"
      check: true
    - id: K3
      weight: must
      point: "Tests proportionality of driver-facing continuous recording against less intrusive options (road-facing only, event-triggered capture, on-device processing), and doesn't accept the safety purpose as settling it."
      source: "GDPR Art. 5(1)(c), 35(7)(b); EDPB Guidelines 3/2019 on video devices"
    - id: K4
      weight: must
      point: "Addresses Art. 22 and national law if weekly scores drive discipline, dismissal, or pay with little real human review."
      source: "GDPR Art. 22, 88; CJEU C-634/21"
    - id: K5
      weight: should
      point: "Addresses the AI Act: monitoring and evaluating workers' performance and behavior is Annex III point 4(b), applying from 2 December 2027; fatigue detection is a physical state outside Art. 5(1)(f), but any inference of emotions would be prohibited at work."
      source: "AI Act Annex III point 4(b); Art. 5(1)(f); Recital 18; Art. 113 as amended"
    - id: K6
      weight: should
      point: "Rates current residual risk High on these facts and flags Art. 36 prior consultation unless verified measures bring it down."
      source: "GDPR Art. 36(1)"

dpia-04-library-ebook-recommendations:
  outcome: "A DPIA is warranted, or at least recommended with reasons: profiling reading history can reveal special category data by inference (religion, health, political opinions, sexual orientation), it covers children under 14, and a public library is a public body, so legitimate interests isn't available for its tasks. The lawful basis is the crux: a public-task basis needs a legal basis in Austrian law covering recommendations, otherwise consent, which must be valid for children."
  points:
    - id: K1
      weight: must
      point: "Recognizes that reading history can reveal special category data by inference, raising Art. 9 and the sensitivity criterion, and that CJEU case law treats indirect revelation as special category data."
      source: "GDPR Art. 9(1); CJEU C-184/20 OT v Vyriausioji tarnybinės etikos komisija"
    - id: K2
      weight: must
      point: "Notes that a public authority can't rely on legitimate interests for its tasks, so the basis is a public task with a legal basis in Austrian law, or consent."
      source: "GDPR Art. 6(1), second subparagraph; Art. 6(1)(e), 6(3)"
    - id: K3
      weight: must
      point: "Addresses children under 14: Austria sets the age of consent for information society services at 14, so consent for younger patrons needs a parent, and children's data weighs more in the risk."
      source: "GDPR Art. 8; Austrian DSG § 4(4); Recital 38"
      check: true
    - id: K4
      weight: should
      point: "Proposes a less intrusive design: opt-in, recommendations computed on the device or from recent loans only, no retention of full history, easy reset."
      source: "GDPR Art. 25"
    - id: K5
      weight: should
      point: "Checks the Austrian DSB's DPIA list (DSFA-V) rather than relying on the EDPB criteria alone."
      source: "Austrian DSFA-V (BGBl. II Nr. 278/2018)"
      check: true

dpia-05-b2b-crm-enrichment:
  outcome: "Either a reasoned 'recommended' or a reasoned 'not indicated' is defensible. Matching datasets and evaluation for prioritizing outreach are arguably present, but the data is professional, the scale is modest, and the effects on individuals are limited. The real issues are the broker's sourcing and the Art. 14 notice, which apply whatever the screening outcome."
  points:
    - id: K1
      weight: must
      point: "Weighs the criteria in substance (what is combined, how individuals are affected, scale and nature) rather than counting them mechanically, and reaches a reasoned outcome either way."
      source: "GDPR Art. 35(1); WP248 rev.01"
    - id: K2
      weight: must
      point: "Requires an Art. 14 notice to the contacts within a month of obtaining the data, or at first contact, naming the source; the disproportionate-effort exception is narrow."
      source: "GDPR Art. 14(1)-(3), 14(5)(b); CJEU C-496/17 Deutsche Post (on Art. 14 effort, for context)"
      check: true
    - id: K3
      weight: must
      point: "Checks the broker's lawful sourcing and the terms of use, since the company becomes responsible for data it obtains unlawfully."
      source: "GDPR Art. 5(1)(a), 5(2), 24"
    - id: K4
      weight: should
      point: "Notes that a legitimate-interests basis for the enrichment needs an LIA, and that outreach by email to contacts in many member states is subject to national rules on B2B email."
      source: "GDPR Art. 6(1)(f); ePrivacy Directive Art. 13"

dpia-06-hospital-ai-triage-update:
  outcome: "An update under Art. 35(11), not a fresh DPIA: rescreen the change and update the affected parts. The switch to a US-hosted foundation model adds a transfer of health data, a new sub-processor needing the hospital's prior authorization, and model changes that invalidate earlier verification. The AI Act makes emergency triage high-risk (Annex III point 5(d)), with deployer duties and a FRIA for a public-service body from 2 December 2027."
  points:
    - id: K1
      weight: must
      point: "Treats it as a review under Art. 35(11) triggered by a change in risk, updating the existing DPIA rather than starting from nothing, and re-rates risks whose measures are no longer verified for the new model."
      source: "GDPR Art. 35(11); risk-method.md"
    - id: K2
      weight: must
      point: "Addresses the transfer of health data to the US: the hosting provider's DPF certification and its scope, or SCCs with a TIA, and whether the vendor's sub-processor change needs the hospital's prior authorization."
      source: "GDPR Arts. 28(2), 28(4), 44-46; Implementing Decision (EU) 2023/1795"
    - id: K3
      weight: must
      point: "Classifies emergency triage as high-risk under Annex III point 5(d) and sets out the hospital's deployer duties and the FRIA for a public-service body, with the 2 December 2027 date."
      source: "AI Act Annex III point 5(d); Arts. 26, 27, 113 as amended"
      check: true
    - id: K4
      weight: should
      point: "Checks whether the vendor's switch is a substantial modification that changes who is the provider, and asks for the provider's updated technical documentation and instructions for use."
      source: "AI Act Arts. 3(23), 13, 25"
    - id: K5
      weight: should
      point: "Keeps Art. 9(2)(h) and the health-sector confidentiality rules in view for the new processing chain, including any use of hospital data by the foundation-model provider for its own purposes."
      source: "GDPR Art. 9(2)(h), 9(3), 28(10)"
