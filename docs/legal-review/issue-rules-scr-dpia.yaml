# Proposed issue rules for DPIA screenings (scr) and DPIAs (dpia). DRAFT for counsel's approval, 2026-10-22.
# Not loaded by gov: once counsel approves (with any edits), move the approved entries into gov/rules/issues.yaml.
# Same format as gov/rules/issues.yaml; tests/test_issue_rule_proposals.py checks they merge cleanly.
# Where an existing field already carries the question (scr national_list, scr state_assessment, the dpia
# consultation block and its Art. 36 finding), no rule is proposed.
issues:
  dpia-art9-condition:
    label: Art. 9 condition
    ask: "For each purpose using special category data, including by inference, the Art. 9(2) condition and its national-law basis where one is needed; for consent, whether it is explicit and freely given given the actual choice and the consequences of refusing"
    cite: "GDPR Art. 9(2), 9(4), 7(4); EDPB Guidelines 05/2020, paras 26-37, 46-50"
    when: {types: [dpia], special_category: possible}
  dpia-automated-decisions:
    label: Automated decisions
    ask: "Whether any decision is based solely on automated processing with legal or similarly significant effects, counting a human who only rubber-stamps the output as no involvement, and the Art. 22(3) safeguards if so"
    cite: "GDPR Art. 22; CJEU C-634/21 (SCHUFA)"
    when: {types: [dpia], context: [profiling]}
  dpia-workplace-monitoring:
    label: Workplace monitoring law
    ask: "The national rules on monitoring workers in each country: prior information to workers and their representatives, any works council or union agreement or authority authorization, and Art. 88 rules"
    cite: "GDPR Art. 88; national employment law, such as BetrVG § 87(1) no. 6, LOPDGDD Arts. 87-89, Law 300/1970 Art. 4"
    when: {types: [dpia], context: [employees]}
  dpia-children:
    label: Children
    ask: "Whether an information society service is offered directly to a child (Art. 8 and the national age), and the extra weight children's data carries in the risk; US children's and student privacy laws where they apply"
    cite: "GDPR Art. 8, Recital 38; COPPA; state student privacy laws"
    when: {types: [dpia], context: [children, school-data]}
  dpia-eprivacy:
    label: ePrivacy and marketing rules
    ask: "The national rules for the marketing channel and for any access to or storage on people's devices, such as tracking pixels, separately from the GDPR basis"
    cite: "ePrivacy Directive Art. 5(3), 13, as implemented nationally"
    when: {types: [dpia], context: [direct-marketing]}
  dpia-ai-act:
    label: AI Act
    ask: "The AI Act classification by intended purpose, the company's role, and which duties apply at rollout and which later, with each date's legal basis"
    cite: "AI Act Arts. 3, 5, 6, 26, 50, 113, as amended by Regulation (EU) 2026/1744"
    when: {types: [dpia], context: [ai-system]}
  dpia-vendor-transfers:
    label: Vendors and transfers
    ask: "Each processor's Art. 28 terms, and whether anyone outside the EEA receives or accesses the data, mapped before naming a Chapter V tool"
    cite: "GDPR Arts. 28, 44-46; EDPB Guidelines 05/2021"
    when: {types: [dpia], context: [vendor]}
  scr-vulnerable-people:
    label: Vulnerable people
    ask: "Whether the people are vulnerable (criterion 7), such as employees given the power imbalance, children, or patients, and whether that weighs toward a DPIA with the other criteria present"
    cite: "WP248 rev.01, criterion 7"
    when: {types: [scr], context: [employees, children, school-data]}
  scr-innovative-technology:
    label: Innovative technology
    ask: "Whether the technology or its use is innovative (criterion 8), and whether an AI impact assessment or AI Act check is needed alongside the DPIA"
    cite: "WP248 rev.01, criterion 8; AI Act Art. 26(9)"
    when: {types: [scr], context: [ai-system]}
  scr-monitoring:
    label: Systematic monitoring
    ask: "Whether the processing observes, monitors, or controls people systematically (criterion 3), including through networks or devices, and the national lists' monitoring items"
    cite: "WP248 rev.01, criterion 3; GDPR Art. 35(3)(c), 35(4)"
    when: {types: [scr], context: [monitoring]}
